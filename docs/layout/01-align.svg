<svg viewBox="0 0 680 290" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace; }
    .dim { font-size: 12px; fill: #57635C; }
    rect.bg { fill: #F8F9F7; }
    rect.grid { fill: url(#graphpaper); }
    rect.frame { fill: none; stroke: rgba(28,35,29,0.34); stroke-width: 1.25; }
    rect.flex { fill: rgba(201,106,34,0.13); stroke: rgba(201,106,34,0.55); stroke-width: 1.25; }
    rect.fixed { fill: rgba(34,125,116,0.13); stroke: rgba(34,125,116,0.55); stroke-width: 1.25; }
  </style>
  <defs>
    <pattern id="graphpaper" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(28,35,29,0.14)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect class="bg" x="0" y="0" width="680" height="290"/>
  <rect class="grid" x="0" y="0" width="680" height="290"/>

  <!-- selfAlign: child 90x50 -->
  <rect class="frame" x="40" y="40" width="180" height="100"/>
  <rect class="frame" x="260" y="40" width="180" height="100"/>
  <rect class="frame" x="480" y="40" width="180" height="100"/>
  <rect class="flex" x="40" y="65" width="90" height="50"/>
  <rect class="flex" x="305" y="65" width="90" height="50"/>
  <rect class="flex" x="570" y="65" width="90" height="50"/>
  <text class="dim" x="130" y="158" text-anchor="middle">selfAlign: 0</text>
  <text class="dim" x="350" y="158" text-anchor="middle">selfAlign: 0.5</text>
  <text class="dim" x="570" y="158" text-anchor="middle">selfAlign: 1</text>

  <!-- contentAlign: three 25x25 boxes -->
  <rect class="frame" x="40" y="170" width="180" height="70"/>
  <rect class="frame" x="260" y="170" width="180" height="70"/>
  <rect class="frame" x="480" y="170" width="180" height="70"/>
  <rect class="fixed" x="40" y="192.5" width="25" height="25"/>
  <rect class="fixed" x="73" y="192.5" width="25" height="25"/>
  <rect class="fixed" x="106" y="192.5" width="25" height="25"/>
  <rect class="fixed" x="304.5" y="192.5" width="25" height="25"/>
  <rect class="fixed" x="337.5" y="192.5" width="25" height="25"/>
  <rect class="fixed" x="370.5" y="192.5" width="25" height="25"/>
  <rect class="fixed" x="569" y="192.5" width="25" height="25"/>
  <rect class="fixed" x="602" y="192.5" width="25" height="25"/>
  <rect class="fixed" x="635" y="192.5" width="25" height="25"/>
  <text class="dim" x="130" y="258" text-anchor="middle">contentAlign: 0</text>
  <text class="dim" x="350" y="258" text-anchor="middle">contentAlign: 0.5</text>
  <text class="dim" x="570" y="258" text-anchor="middle">contentAlign: 1</text>
</svg>
