<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace; }
    .label { font-size: 13px; fill: #1C2321; }
    .tag { font-size: 12px; fill: #8A968F; }
    .tag-small { font-size: 10px; fill: #8A968F; }
    .dim { font-size: 12px; fill: #57635C; }
    .dim-small { font-size: 10px; fill: #57635C; }
    line.dim { stroke: #8A968F; stroke-width: 1; }
    line.ext { stroke: rgba(28,35,29,0.34); stroke-width: 1; }
    rect.bg { fill: #F8F9F7; }
    rect.grid { fill: url(#graphpaper); }
    rect.frame { fill: none; stroke: rgba(28,35,29,0.34); stroke-width: 1.25; }
    rect.container { fill: none; stroke: rgba(28,35,29,0.5); stroke-width: 1.25; stroke-dasharray: 4 3; }
    rect.flex { fill: rgba(201,106,34,0.13); stroke: rgba(201,106,34,0.55); stroke-width: 1.25; }
    rect.fixed { fill: rgba(34,125,116,0.13); stroke: rgba(34,125,116,0.55); stroke-width: 1.25; }
  </style>
  <defs>
    <pattern id="graphpaper" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(28,35,29,0.14)" stroke-width="1"/>
    </pattern>
    <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M5,0 L5,10" stroke="#8A968F" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="680" height="420"/>
  <rect class="grid" x="0" y="0" width="680" height="420"/>

  <text class="tag" x="40" y="82">HBox</text>
  <rect class="frame" x="40" y="90" width="600" height="300"/>

  <!-- border, along the main (X) axis only -->
  <line class="ext" x1="640" y1="68" x2="640" y2="90"/>
  <line class="ext" x1="620" y1="68" x2="620" y2="90"/>
  <line class="dim" x1="620" y1="68" x2="640" y2="68" marker-start="url(#tick)" marker-end="url(#tick)"/>
  <text class="dim" x="648" y="64" text-anchor="end">border: 20px</text>

  <!-- spacing between top-level children, along the main (X) axis -->
  <line class="ext" x1="200" y1="78" x2="200" y2="90"/>
  <line class="ext" x1="220" y1="78" x2="220" y2="90"/>
  <line class="dim" x1="200" y1="78" x2="220" y2="78" marker-start="url(#tick)" marker-end="url(#tick)"/>
  <text class="dim" x="210" y="72" text-anchor="middle">spacing: 20px</text>

  <!-- left: fixed panel, full height (border does not inset the cross axis) -->
  <rect class="fixed" x="60" y="90" width="140" height="300"/>
  <text class="label" x="130" y="244" text-anchor="middle">fixed: 140px</text>

  <!-- middle: nested VBox, full height -->
  <rect class="container" x="220" y="90" width="190" height="300"/>
  <text class="tag-small" x="228" y="106">VBox</text>
  <rect class="fixed" x="220" y="90" width="190" height="80"/>
  <text class="label" x="315" y="134" text-anchor="middle">fixed: 80px</text>
  <rect class="flex" x="220" y="185" width="190" height="205"/>
  <text class="label" x="315" y="291" text-anchor="middle">weight: 1</text>

  <!-- nested VBox internal spacing -->
  <line class="dim" x1="225" y1="170" x2="225" y2="185" marker-start="url(#tick)" marker-end="url(#tick)"/>
  <text class="dim-small" x="235" y="181">spacing: 15px</text>

  <!-- right: flex panel, full height -->
  <rect class="flex" x="430" y="90" width="190" height="300"/>
  <text class="label" x="525" y="244" text-anchor="middle">weight: 1</text>
</svg>
